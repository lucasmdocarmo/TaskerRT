[workspace]
resolver = "3"
members  = ["crates/tasker-core", "crates/tasker-sim", "crates/tasker-wal", "crates/tasker-bench", "crates/tasker-proto", "crates/taskerd", "crates/tasker-worker", "crates/tasker-cli"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96"
license      = "MIT OR Apache-2.0"
authors      = ["Lucas Mariano do Carmo"]

[workspace.dependencies]
smallvec = "1"
thiserror = "2"
proptest = "1"
criterion = "0.8.2"
tasker-core = { path = "crates/tasker-core" }
tasker-sim = { path = "crates/tasker-sim" }
tasker-wal = { path = "crates/tasker-wal" }
tasker-proto = { path = "crates/tasker-proto" }
taskerd = { path = "crates/taskerd" }
tasker-worker = { path = "crates/tasker-worker" }
tasker-cli = { path = "crates/tasker-cli" }
hdrhistogram = "7"
prometheus = "0.14"
axum = "0.8"
bytes = "1"
crc32fast = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-build = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn        = "deny"
rust_2018_idioms              = { level = "warn", priority = -1 }
unreachable_pub               = "warn"
missing_debug_implementations = "warn"
let_underscore_drop           = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"
missing_safety_doc        = "deny"
await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"
cast_possible_truncation  = "warn"
cast_sign_loss            = "warn"
cast_precision_loss       = "warn"
or_fun_call               = "warn"
dbg_macro                 = "warn"
todo                      = "warn"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = 1

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
debug = 1
