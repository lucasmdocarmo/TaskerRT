apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasker-worker
  namespace: tasker
spec:
  # KEDA owns replicas after the ScaledObject is applied.
  replicas: 1
  selector:
    matchLabels: { app: tasker-worker }
  template:
    metadata:
      labels: { app: tasker-worker }
    spec:
      # Long enough for a draining worker to finish a task before SIGKILL.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: tasker/tasker-worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          args:
            - --daemon=http://taskerd.tasker.svc.cluster.local:7070
            - --name=$(POD_NAME)
            - --cpu-millis=4000
            - --executor=sleep
            - --drain-timeout=50
          resources:
            requests: { cpu: 250m, memory: 64Mi }
            limits: { cpu: "4", memory: 256Mi }
