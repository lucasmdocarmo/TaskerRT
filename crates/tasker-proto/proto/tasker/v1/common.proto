syntax = "proto3";
package tasker.v1;

message Resources {
  uint32 cpu_millis = 1;
  uint64 mem_bytes = 2;
  uint32 gpus = 3;
}

enum PriorityClass {
  PRIORITY_CLASS_UNSPECIFIED = 0;
  PRIORITY_CLASS_LOW = 1;
  PRIORITY_CLASS_NORMAL = 2;
  PRIORITY_CLASS_HIGH = 3;
  PRIORITY_CLASS_URGENT = 4;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_SUBMITTED = 1;
  JOB_STATE_BLOCKED = 2;
  JOB_STATE_READY = 3;
  JOB_STATE_RUNNING = 4;
  JOB_STATE_COMPLETED = 5;
  JOB_STATE_FAILED = 6;
  JOB_STATE_PREEMPTED = 7;
  JOB_STATE_CANCELLED = 8;
}
